services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      DB_HOST: db
      DB_PORT: 5432 #port par défaut de PHP
      DB_NAME: foodbattle
      DB_USER: foodbattle
      DB_PASSWORD: foodbattle_local
      APP_ENV: ${APP_ENV:-development}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
    volumes:
      - .:/var/www/html
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: foodbattle
      POSTGRES_USER: foodbattle
      POSTGRES_PASSWORD: foodbattle_local
    volumes:
      - foodbattle_data:/var/lib/postgresql/data
      - ./migrations/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./migrations/002_archive_plats.sql:/docker-entrypoint-initdb.d/02-archive-plats.sql:ro
      - ./migrations/003_moderation_categories.sql:/docker-entrypoint-initdb.d/03-moderation-categories.sql:ro
      - ./migrations/004_moderation_plats_restaurants.sql:/docker-entrypoint-initdb.d/04-moderation-plats-restaurants.sql:ro
      - ./migrations/005_tournament_runs.sql:/docker-entrypoint-initdb.d/05-tournament-runs.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U foodbattle -d foodbattle" ]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  foodbattle_data:
